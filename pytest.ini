[pytest]
# 单一事件循环纪律（§3.3）：所有 async 用例直接被识别，无需逐个加 decorator
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
# 默认不跑 net：真外部服务要花钱、要授权、还慢。显式 `-m net` 会盖掉这里的过滤
# （命令行的 -m 覆盖 addopts 的 -m），所以探测随时能单独跑。
addopts = -ra --strict-markers -m "not net"
markers =
    pg: 需要真实 PostgreSQL 实例（读 PG_ADMIN_DSN）；本地用 podman 起库后执行
    net: 需要访问真实外部服务（TAPD / 飞书 / 模型网关）；默认 -m "not net"
filterwarnings =
    ignore::DeprecationWarning
